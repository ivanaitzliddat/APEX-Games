<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>APEX Games</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/effects.css">
</head>
<body>
    <!-- Debug panel for Mini App (tap 5 times on title to toggle) -->
    <div id="debug-panel" style="display:none;position:fixed;bottom:0;left:0;right:0;max-height:40vh;overflow-y:auto;background:#1a1a2e;border-top:2px solid #e94560;font-family:monospace;font-size:11px;padding:8px;z-index:9999;">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
            <strong style="color:#4ecca3;">Debug Log</strong>
            <button onclick="document.getElementById('debug-log').innerHTML='';this.blur();" style="background:#e94560;color:white;border:none;padding:2px 8px;border-radius:4px;">Clear</button>
        </div>
        <div id="debug-log"></div>
    </div>
    <script>
        (function() {
            const origLog = console.log;
            const origWarn = console.warn;
            const origError = console.error;
            function addToDebug(type, args) {
                const panel = document.getElementById('debug-log');
                if (!panel) return;
                const msg = Array.from(args).map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ');
                const colors = {log: '#eee', warn: '#f0a500', error: '#e94560'};
                panel.innerHTML += `<div style="color:${colors[type]};margin:2px 0;word-break:break-all;">[${type}] ${msg}</div>`;
                panel.scrollTop = panel.scrollHeight;
            }
            console.log = function() { origLog.apply(console, arguments); addToDebug('log', arguments); };
            console.warn = function() { origWarn.apply(console, arguments); addToDebug('warn', arguments); };
            console.error = function() { origError.apply(console, arguments); addToDebug('error', arguments); };
        })();
    </script>

    <div id="app">
        <div id="loading" class="view active">
            <div class="loading-spinner"></div>
            <p>Connecting...</p>
        </div>

        <!-- Platform views -->
        <div id="home-view" class="view"></div>
        <div id="games-view" class="view"></div>
        <div id="calendar-view" class="view"></div>
        <div id="challenges-view" class="view"></div>
        <div id="newsletter-view" class="view"></div>
        <div id="feedback-view" class="view"></div>
        <div id="feedback-form-view" class="view"></div>
        <div id="about-view" class="view"></div>
        <div id="admin-view" class="view"></div>

        <!-- Game session views -->
        <div id="landing-view" class="view"></div>
        <div id="lobby-view" class="view"></div>
        <div id="game-view" class="view"></div>
        <div id="observer-view" class="view"></div>
        <div id="results-view" class="view"></div>
    </div>

    <!-- Bottom Navigation (hidden during game sessions) -->
    <nav id="bottom-nav" class="bottom-nav" style="display:none;">
        <a class="nav-home-btn" data-route="home" href="#home">&#x2302;</a>
    </nav>

    <!-- Core scripts -->
    <script src="js/telegram.js?v=15"></script>
    <script src="js/api.js?v=15"></script>
    <script src="js/ws.js?v=15"></script>

    <!-- Components -->
    <script src="js/components/card.js?v=15"></script>
    <script src="js/components/playerList.js?v=15"></script>

    <!-- Game-specific UI -->
    <script src="js/games/ride_the_bus.js?v=15"></script>

    <!-- Platform views -->
    <script src="js/views/home.js?v=15"></script>
    <script src="js/views/games.js?v=15"></script>
    <script src="js/views/calendar.js?v=15"></script>
    <script src="js/views/challenges.js?v=15"></script>
    <script src="js/views/newsletter.js?v=15"></script>
    <script src="js/views/feedback.js?v=15"></script>
    <script src="js/views/about.js?v=19"></script>

    <!-- Game session views -->
    <script src="js/views/landing.js?v=15"></script>
    <script src="js/views/lobby.js?v=15"></script>
    <script src="js/views/game.js?v=15"></script>
    <script src="js/views/observer.js?v=15"></script>
    <script src="js/views/results.js?v=15"></script>

    <!-- App entry point (must be last) -->
    <script src="js/app.js?v=15"></script>
</body>
</html>
